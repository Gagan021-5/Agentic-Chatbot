# ═══════════════════════════════════════════════════════
# RentPrompts — Docker Compose (Python backend only)
# ═══════════════════════════════════════════════════════

version: "3.9"

services:
  python-backend:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - CHROMA_PERSIST_DIR=/app/data/chromadb
      - ENVIRONMENT=production
      - REACT_ORIGIN=${REACT_ORIGIN:-http://localhost:5173}
    volumes:
      - chromadb-data:/app/data/chromadb
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - rentprompts

volumes:
  chromadb-data:
    driver: local

networks:
  rentprompts:
    driver: bridge
